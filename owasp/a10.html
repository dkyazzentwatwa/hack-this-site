<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A10 - SSRF - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">A10 - SSRF</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>OWASP</h2>
        <a href="/owasp/">All OWASP</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A10 Labs</h2>
      <div class="lab">
        <div>
          <h3>A10-001 SSRF Scanner</h3>
          <p>URL fetcher endpoint accepts arbitrary URLs.</p>
          <form id="ssrf-form">
            <div class="form-field">
              <label for="url">URL</label>
              <input id="url" name="url" type="text" value="http://169.254.169.254/latest/meta-data/">
            </div>
            <button type="submit">Fetch</button>
          </form>
        </div>
        <div>
          <pre id="ssrf-output" class="notice mono">Output...</pre>
        </div>
      </div>
      <script>
        document.getElementById('ssrf-form').addEventListener('submit', function (e) {
          e.preventDefault();
          var url = document.getElementById('url').value;
          fetch('/api/fetch?url=' + encodeURIComponent(url))
            .then(r => r.text())
            .then(t => { document.getElementById('ssrf-output').textContent = t; });
        });
      </script>
    </main>
  </div>
</body>
</html>
