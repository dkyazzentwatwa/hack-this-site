<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Headers Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">Security Headers</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a05.html">A05 Misconfig</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A05-001 Security Headers Audit</h2>
      <div class="lab" data-lab-id="security-headers">
        <div>
          <h3>Missing Headers</h3>
          <p>This page intentionally sets no security headers or CSP.</p>
          <div class="notice mono">Expected missing: CSP, HSTS, X-Frame-Options, X-Content-Type-Options</div>
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button type="button" onclick="probeHeaders()">Call /api/headers</button>
            <button type="button" class="validate-btn" onclick="validateHeaders()">Validate Solution</button>
          </div>
        </div>
        <div>
          <pre id="headers-output" class="notice mono">Output...</pre>
          <div id="validation-result"></div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Attach educational content
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        attachLabContent('security-headers');
      });
    } else {
      attachLabContent('security-headers');
    }

    function probeHeaders() {
      fetch('/api/headers').then(function (r) { return r.text(); })
        .then(function (t) { document.getElementById('headers-output').textContent = t; });
    }

    async function validateHeaders() {
      var resultEl = document.getElementById('validation-result');
      showLoading(resultEl);

      try {
        var sessionId = localStorage.getItem('session-id') || 'session-' + Date.now();
        localStorage.setItem('session-id', sessionId);

        // Check response headers
        var response = await fetch('/api/headers');
        var csp = response.headers.get('Content-Security-Policy');
        var hsts = response.headers.get('Strict-Transport-Security');
        var xFrame = response.headers.get('X-Frame-Options');
        var xContent = response.headers.get('X-Content-Type-Options');

        var foundMissingCSP = !csp || csp.length === 0;
        var foundMissingHSTS = !hsts || hsts.length === 0;
        var foundMissingXFrameOptions = !xFrame || xFrame.length === 0;
        var foundMissingXContentType = !xContent || xContent.length === 0;

        var validationResponse = await fetch('/api/validate/security-headers?sessionId=' + sessionId +
          '&foundMissingCSP=' + foundMissingCSP +
          '&foundMissingHSTS=' + foundMissingHSTS +
          '&foundMissingXFrameOptions=' + foundMissingXFrameOptions +
          '&foundMissingXContentType=' + foundMissingXContentType +
          '&identifiedRisk=true');
        var data = await validationResponse.json();

        hideLoading(resultEl);

        if (data.success) {
          showSuccess(resultEl, data.message);
          if (data.explanation) {
            var explanation = document.createElement('div');
            explanation.className = 'notice';
            explanation.style.marginTop = '12px';
            explanation.innerHTML = '<strong>Explanation:</strong> ' + data.explanation;
            resultEl.appendChild(explanation);
          }
          if (data.nextSteps) {
            var nextSteps = document.createElement('div');
            nextSteps.className = 'notice';
            nextSteps.style.marginTop = '8px';
            nextSteps.innerHTML = '<strong>Next Steps:</strong> ' + data.nextSteps;
            resultEl.appendChild(nextSteps);
          }
          markLabComplete('security-headers');
        } else {
          showError(resultEl, data.hint || 'Validation failed. Try again!');
        }
      } catch (error) {
        hideLoading(resultEl);
        showError(resultEl, 'Validation request failed. Check your connection.');
        console.error('Validation error:', error);
      }
    }
  </script>
</body>
</html>
