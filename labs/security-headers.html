<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Security Headers Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">Security Headers</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a05.html">A05 Misconfig</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A05-001 Security Headers Audit</h2>
      <div class="lab" data-lab-id="security-headers">
        <div>
          <h3>Missing Headers</h3>
          <p>This page intentionally sets no security headers or CSP.</p>
          <div class="notice mono">Expected missing: CSP, HSTS, X-Frame-Options, X-Content-Type-Options</div>
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button type="button" onclick="probeHeaders()">Call /api/headers</button>
            <button type="button" class="validate-btn" onclick="validateHeaders()">Validate Solution</button>
          </div>
        </div>
        <div>
          <pre id="headers-output" class="notice mono">Output...</pre>
          <div id="validation-result"></div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Attach educational content
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        attachLabContent('security-headers');
      });
    } else {
      attachLabContent('security-headers');
    }

    function probeHeaders() {
      fetch('/api/headers').then(function (r) { return r.text(); })
        .then(function (t) { document.getElementById('headers-output').textContent = t; });
    }

    async function validateHeaders() {
      var resultEl = document.getElementById('validation-result');
      // Inspect the real response: grab the version-leak fingerprint and list the missing headers.
      var aspNetVersion = '';
      var missing = [];
      try {
        var response = await fetch('/api/headers');
        aspNetVersion = response.headers.get('X-AspNet-Version') || '';
        ['content-security-policy', 'x-frame-options', 'strict-transport-security', 'x-content-type-options']
          .forEach(function (h) { if (!response.headers.get(h)) missing.push(h); });
      } catch (e) {}
      await submitValidation('security-headers', { aspNetVersion: aspNetVersion, missing: missing }, resultEl);
    }
  </script>
</body>
</html>
