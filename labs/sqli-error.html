<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQLi Error Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">SQLi Error</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a03.html">A03 Injection</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A03-001 SQL Injection (Error)</h2>
      <div class="lab" data-lab-id="sqli-error">
        <div>
          <h3>Unsafe Query Builder</h3>
          <p>Simulated SQL error messages for common payloads.</p>
          <form id="sqli-form">
            <div class="form-field">
              <label for="user">User ID</label>
              <input id="user" type="text" value="1">
            </div>
            <div style="display:flex; gap:8px;">
              <button type="submit">Run Query</button>
              <button type="button" class="validate-btn" onclick="validateSQLi()">Validate Solution</button>
            </div>
          </form>
        </div>
        <div>
          <div id="sqli-output" class="notice mono">Query OK: SELECT * FROM users WHERE id = 1</div>
          <div id="validation-result"></div>
        </div>
      </div>
      <script>
        // Attach educational content
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            attachLabContent('sqli-error');
          });
        } else {
          attachLabContent('sqli-error');
        }

        document.getElementById("sqli-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var id = document.getElementById("user").value;
          fetch("/api/sql?id=" + encodeURIComponent(id))
            .then(function (r) { return r.text(); })
            .then(function (t) { document.getElementById("sqli-output").textContent = t; });
        });

        async function validateSQLi() {
          var payload = document.getElementById('user').value;
          var resultEl = document.getElementById('validation-result');

          showLoading(resultEl);

          try {
            var sessionId = localStorage.getItem('session-id') || 'session-' + Date.now();
            localStorage.setItem('session-id', sessionId);

            var response = await fetch('/api/validate/sqli-error?payload=' + encodeURIComponent(payload) + '&sessionId=' + sessionId);
            var data = await response.json();

            hideLoading(resultEl);

            if (data.success) {
              showSuccess(resultEl, data.message);
              if (data.explanation) {
                var explanation = document.createElement('div');
                explanation.className = 'notice';
                explanation.style.marginTop = '12px';
                explanation.innerHTML = '<strong>Explanation:</strong> ' + data.explanation;
                resultEl.appendChild(explanation);
              }
              if (data.nextSteps) {
                var nextSteps = document.createElement('div');
                nextSteps.className = 'notice';
                nextSteps.style.marginTop = '8px';
                nextSteps.innerHTML = '<strong>Next Steps:</strong> ' + data.nextSteps;
                resultEl.appendChild(nextSteps);
              }
              markLabComplete('sqli-error');
            } else {
              showError(resultEl, data.hint || 'Validation failed. Try again!');
            }
          } catch (error) {
            hideLoading(resultEl);
            showError(resultEl, 'Validation request failed. Check your connection.');
            console.error('Validation error:', error);
          }
        }
      </script>
    </main>
  </div>
</body>
</html>
