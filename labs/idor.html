<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDOR Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">IDOR</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a01.html">A01 Access Control</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A01-001 IDOR Scanner</h2>
      <div class="lab" data-lab-id="idor">
        <div>
          <h3>Order Lookup</h3>
          <p>No authorization checks. Change the order id.</p>
          <form>
            <div class="form-field">
              <label for="order">Order ID</label>
              <input id="order" type="text" value="1001">
            </div>
            <div style="display:flex; gap:8px;">
              <button type="button" onclick="loadOrder()">Load Order</button>
              <button type="button" class="validate-btn" onclick="validateIDOR()">Validate Solution</button>
            </div>
          </form>
        </div>
        <div>
          <div id="order-output" class="notice mono">Order data will appear here.</div>
          <div id="validation-result"></div>
        </div>
      </div>
      <script>
        // Attach educational content
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            attachLabContent('idor');
          });
        } else {
          attachLabContent('idor');
        }

        function loadOrder() {
          var id = document.getElementById("order").value;
          fetch("/api/orders/" + encodeURIComponent(id))
            .then(function (r) { return r.json(); })
            .then(function (data) {
              document.getElementById("order-output").textContent = JSON.stringify(data, null, 2);
            });
        }
        var params = new URLSearchParams(location.search);
        if (params.get("order")) {
          document.getElementById("order").value = params.get("order");
          loadOrder();
        }

        async function validateIDOR() {
          var orderId = document.getElementById('order').value.trim();
          var resultEl = document.getElementById('validation-result');
          // Capture the owner of the order you accessed as proof of the IDOR.
          var owner = '';
          try {
            var lookup = await fetch('/api/orders/' + encodeURIComponent(orderId));
            var json = await lookup.json();
            owner = json && json.order ? json.order.user : '';
          } catch (e) {}
          await submitValidation('idor', { orderId: orderId, owner: owner }, resultEl);
        }
      </script>
    </main>
  </div>
</body>
</html>
