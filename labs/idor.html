<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDOR Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">IDOR</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a01.html">A01 Access Control</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A01-001 IDOR Scanner</h2>
      <div class="lab" data-lab-id="idor">
        <div>
          <h3>Order Lookup</h3>
          <p>No authorization checks. Change the order id.</p>
          <form>
            <div class="form-field">
              <label for="order">Order ID</label>
              <input id="order" type="text" value="1001">
            </div>
            <div style="display:flex; gap:8px;">
              <button type="button" onclick="loadOrder()">Load Order</button>
              <button type="button" class="validate-btn" onclick="validateIDOR()">Validate Solution</button>
            </div>
          </form>
        </div>
        <div>
          <div id="order-output" class="notice mono">Order data will appear here.</div>
          <div id="validation-result"></div>
        </div>
      </div>
      <script>
        // Attach educational content
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            attachLabContent('idor');
          });
        } else {
          attachLabContent('idor');
        }

        function loadOrder() {
          var id = document.getElementById("order").value;
          fetch("/api/orders/" + encodeURIComponent(id))
            .then(function (r) { return r.json(); })
            .then(function (data) {
              document.getElementById("order-output").textContent = JSON.stringify(data, null, 2);
            });
        }
        var params = new URLSearchParams(location.search);
        if (params.get("order")) {
          document.getElementById("order").value = params.get("order");
          loadOrder();
        }

        async function validateIDOR() {
          var orderId = document.getElementById('order').value;
          var resultEl = document.getElementById('validation-result');

          showLoading(resultEl);

          try {
            var sessionId = localStorage.getItem('session-id') || 'session-' + Date.now();
            localStorage.setItem('session-id', sessionId);

            var response = await fetch('/api/validate/idor?orderId=' + encodeURIComponent(orderId) + '&sessionId=' + sessionId);
            var data = await response.json();

            hideLoading(resultEl);

            if (data.success) {
              showSuccess(resultEl, data.message);
              if (data.explanation) {
                var explanation = document.createElement('div');
                explanation.className = 'notice';
                explanation.style.marginTop = '12px';
                explanation.innerHTML = '<strong>Explanation:</strong> ' + data.explanation;
                resultEl.appendChild(explanation);
              }
              if (data.nextSteps) {
                var nextSteps = document.createElement('div');
                nextSteps.className = 'notice';
                nextSteps.style.marginTop = '8px';
                nextSteps.innerHTML = '<strong>Next Steps:</strong> ' + data.nextSteps;
                resultEl.appendChild(nextSteps);
              }
              markLabComplete('idor');
            } else {
              showError(resultEl, data.hint || 'Validation failed. Try again!');
            }
          } catch (error) {
            hideLoading(resultEl);
            showError(resultEl, 'Validation request failed. Check your connection.');
            console.error('Validation error:', error);
          }
        }
      </script>
    </main>
  </div>
</body>
</html>
