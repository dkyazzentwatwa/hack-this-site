<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Git Exposure Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">Git Exposure</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a05.html">A05 Misconfig</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">VULN-007 Git/SVN Exposure</h2>
      <div class="lab" data-lab-id="git-exposure">
        <div>
          <h3>Exposed Git Metadata</h3>
          <p>Simulated .git files are accessible.</p>
          <div class="notice mono">/.git/HEAD | /.git/config</div>
          <button type="button" class="validate-btn" style="margin-top:8px" onclick="validateGitExposure()">Validate Solution</button>
        </div>
        <div>
          <div class="notice">Use your shortcut to detect exposed repos.</div>
          <div id="validation-result"></div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Attach educational content
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        attachLabContent('git-exposure');
      });
    } else {
      attachLabContent('git-exposure');
    }

    async function validateGitExposure() {
      var resultEl = document.getElementById('validation-result');
      // Actually fetch the exposed metadata and submit a real line from it as proof.
      var evidence = '';
      try {
        var head = await fetch('/.git/HEAD');
        if (head.ok) evidence = (await head.text()).trim();
        if (!evidence) {
          var cfg = await fetch('/.git/config');
          if (cfg.ok) evidence = (await cfg.text()).trim();
        }
      } catch (e) {}
      await submitValidation('git-exposure', { evidence: evidence }, resultEl);
    }
  </script>
</body>
</html>
