<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reflected XSS Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">Reflected XSS</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a03.html">A03 Injection</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A03-006 Reflected XSS (DOM)</h2>
      <div class="lab" data-lab-id="xss-reflected">
        <div>
          <h3>Unsafe Reflection</h3>
          <p>Input from the URL is written directly into the DOM.</p>
          <div class="notice mono">Try: ?q=<img src=x onerror=alert(1)></div>
          <div id="xss-output" class="notice mono" style="margin-top:8px">Output area...</div>
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button type="button" onclick="window.open('/api/reflect?q='+encodeURIComponent(document.getElementById('q').value))">Open /api/reflect</button>
            <button type="button" class="validate-btn" onclick="validateXSS()">Validate Solution</button>
          </div>
          <div id="validation-result"></div>
        </div>
        <div>
          <form>
            <div class="form-field">
              <label for="q">Query</label>
              <input id="q" type="text" value="hello">
            </div>
            <button type="button" onclick="location.search='?q='+encodeURIComponent(document.getElementById('q').value)">Update URL</button>
          </form>
        </div>
      </div>
      <script>
        // Attach educational content
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function() {
            attachLabContent('xss-reflected', {
              targetSelector: '.lab',
              position: 'prepend'
            });
          });
        } else {
          attachLabContent('xss-reflected', {
            targetSelector: '.lab',
            position: 'prepend'
          });
        }

        var params = new URLSearchParams(location.search);
        var q = params.get("q") || "(empty)";
        // Intentionally unsafe sink
        document.getElementById("xss-output").innerHTML = q;

        async function validateXSS() {
          var payload = document.getElementById('q').value;
          var resultEl = document.getElementById('validation-result');
          var outputEl = document.getElementById('xss-output');

          showLoading(resultEl);

          try {
            var sessionId = localStorage.getItem('session-id') || 'session-' + Date.now();
            localStorage.setItem('session-id', sessionId);

            var response = await fetch('/api/validate/xss-reflected?payload=' + encodeURIComponent(payload) + '&sessionId=' + sessionId);
            var data = await response.json();

            hideLoading(resultEl);

            if (data.success) {
              showSuccess(resultEl, data.message);
              if (data.explanation) {
                var explanation = document.createElement('div');
                explanation.className = 'notice';
                explanation.style.marginTop = '12px';
                explanation.innerHTML = '<strong>Explanation:</strong> ' + data.explanation;
                resultEl.appendChild(explanation);
              }
              if (data.nextSteps) {
                var nextSteps = document.createElement('div');
                nextSteps.className = 'notice';
                nextSteps.style.marginTop = '8px';
                nextSteps.innerHTML = '<strong>Next Steps:</strong> ' + data.nextSteps;
                resultEl.appendChild(nextSteps);
              }
              markLabComplete('xss-reflected');
            } else {
              showError(resultEl, data.hint || 'Validation failed. Try again!');
              if (data.attemptCount) {
                var attempts = document.createElement('div');
                attempts.className = 'notice mono';
                attempts.style.marginTop = '8px';
                attempts.style.fontSize = '12px';
                attempts.textContent = 'Attempts: ' + data.attemptCount;
                resultEl.appendChild(attempts);
              }
            }
          } catch (error) {
            hideLoading(resultEl);
            showError(resultEl, 'Validation request failed. Check your connection.');
            console.error('Validation error:', error);
          }
        }
      </script>
    </main>
  </div>
</body>
</html>
