<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Input Validation Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">Input Validation</div>
      <a class="home-link" href="/home/">Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/owasp/a03.html">A03 Injection</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">INPUT-001 Parameter Fuzzer</h2>
      <div class="lab" data-lab-id="input-validation">
        <div>
          <h3>Validation Simulator</h3>
          <p>Submit payloads to detect weak validation.</p>
          <div class="form-field">
            <label for="input">Input</label>
            <input id="input" type="text" value="%00%2e%2e%2f%252e%252e%252f">
          </div>
          <div style="display:flex; gap:8px;">
            <button type="button" onclick="testInput()">Test Input</button>
            <button type="button" class="validate-btn" onclick="validateSolution()">Validate Solution</button>
          </div>
        </div>
        <div>
          <pre id="validate-output" class="notice mono">Output...</pre>
          <div id="validation-result"></div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Attach educational content
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        attachLabContent('input-validation');
      });
    } else {
      attachLabContent('input-validation');
    }

    function testInput() {
      var input = document.getElementById('input').value;
      fetch('/api/validate?input=' + encodeURIComponent(input))
        .then(function (r) { return r.text(); })
        .then(function (t) { document.getElementById('validate-output').textContent = t; });
    }

    async function validateSolution() {
      var payload = document.getElementById('input').value;
      var resultEl = document.getElementById('validation-result');

      showLoading(resultEl);

      try {
        var sessionId = localStorage.getItem('session-id') || 'session-' + Date.now();
        localStorage.setItem('session-id', sessionId);

        var response = await fetch('/api/validate/input-validation?payload=' + encodeURIComponent(payload) + '&sessionId=' + sessionId);
        var data = await response.json();

        hideLoading(resultEl);

        if (data.success) {
          showSuccess(resultEl, data.message);
          if (data.explanation) {
            var explanation = document.createElement('div');
            explanation.className = 'notice';
            explanation.style.marginTop = '12px';
            explanation.innerHTML = '<strong>Explanation:</strong> ' + data.explanation;
            resultEl.appendChild(explanation);
          }
          if (data.nextSteps) {
            var nextSteps = document.createElement('div');
            nextSteps.className = 'notice';
            nextSteps.style.marginTop = '8px';
            nextSteps.innerHTML = '<strong>Next Steps:</strong> ' + data.nextSteps;
            resultEl.appendChild(nextSteps);
          }
          markLabComplete('input-validation');
        } else {
          showError(resultEl, data.hint || 'Validation failed. Try again!');
        }
      } catch (error) {
        hideLoading(resultEl);
        showError(resultEl, 'Validation request failed. Check your connection.');
        console.error('Validation error:', error);
      }
    }
  </script>
</body>
</html>
