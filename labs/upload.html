<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>File Upload Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">File Upload</div>
      <a class="home-link" href="/home/">Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/owasp/a03.html">A03 Injection</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">VULN-004 File Upload</h2>
      <div class="lab" data-lab-id="upload">
        <div>
          <h3>Upload Simulator</h3>
          <p>Test extension, MIME, and path traversal validation.</p>
          <div class="form-field">
            <label for="filename">Filename</label>
            <input id="filename" type="text" value="shell.php.jpg">
          </div>
          <div class="form-field">
            <label for="contentType">Content-Type</label>
            <input id="contentType" type="text" value="image/png">
          </div>
          <div class="form-field">
            <label for="data">Content (base64/plain)</label>
            <textarea id="data" rows="4">PHNjcmlwdD5hbGVydCgxKTwvc2NyaXB0Pg==</textarea>
          </div>
          <div style="display:flex; gap:8px;">
            <button type="button" onclick="upload()">Upload</button>
            <button type="button" class="validate-btn" onclick="validateUpload()">Validate Solution</button>
          </div>
        </div>
        <div>
          <pre id="upload-output" class="notice mono">Output...</pre>
          <div id="validation-result"></div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Attach educational content
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        attachLabContent('upload');
      });
    } else {
      attachLabContent('upload');
    }

    function upload() {
      var payload = {
        filename: document.getElementById('filename').value,
        contentType: document.getElementById('contentType').value,
        data: document.getElementById('data').value
      };
      fetch('/api/upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      })
        .then(function (r) { return r.text(); })
        .then(function (t) { document.getElementById('upload-output').textContent = t; });
    }

    async function validateUpload() {
      var fileName = document.getElementById('filename').value;
      var resultEl = document.getElementById('validation-result');
      // The server applies the same naive filter + execution check a real app would.
      await submitValidation('upload', { fileName: fileName }, resultEl);
    }
  </script>
</body>
</html>
