<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Scanner Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <!-- SECRET_KEY=sk_test_123456 -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">Secret Scanner</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a02.html">A02 Crypto Failures</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A02-002 Secret Scanner</h2>
      <div class="lab" data-lab-id="secret-scanner">
        <div>
          <h3>Exposed Secrets</h3>
          <p>Secrets are deliberately left in comments, JS, and storage.</p>
          <div class="notice mono">window.__SECRET_KEY__</div>
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button type="button" onclick="loadSecrets()">Fetch /api/admin/secrets</button>
            <button type="button" class="validate-btn" onclick="validateSecrets()">Validate Solution</button>
          </div>
        </div>
        <div>
          <div class="notice mono">AWS_KEY=AKIA_TEST_EXAMPLE</div>
          <pre id="secret-output" class="notice mono" style="margin-top:8px">Output...</pre>
          <div id="validation-result"></div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Attach educational content
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        attachLabContent('secret-scanner');
      });
    } else {
      attachLabContent('secret-scanner');
    }

    function loadSecrets() {
      fetch('/api/admin/secrets')
        .then(function (r) { return r.text(); })
        .then(function (t) { document.getElementById('secret-output').textContent = t; });
    }

    async function validateSecrets() {
      var resultEl = document.getElementById('validation-result');
      showLoading(resultEl);

      try {
        var sessionId = localStorage.getItem('session-id') || 'session-' + Date.now();
        localStorage.setItem('session-id', sessionId);

        // Check if found secrets in HTML comments, window object, or visible areas
        var foundSecretInHtml = document.documentElement.innerHTML.includes('SECRET_KEY');
        var foundSecretInJs = typeof window.__SECRET_KEY__ !== 'undefined';

        var response = await fetch('/api/validate/secret-scanner?sessionId=' + sessionId +
          '&foundSecretInHtml=' + foundSecretInHtml +
          '&foundSecretInJs=' + foundSecretInJs);
        var data = await response.json();

        hideLoading(resultEl);

        if (data.success) {
          showSuccess(resultEl, data.message);
          if (data.explanation) {
            var explanation = document.createElement('div');
            explanation.className = 'notice';
            explanation.style.marginTop = '12px';
            explanation.innerHTML = '<strong>Explanation:</strong> ' + data.explanation;
            resultEl.appendChild(explanation);
          }
          if (data.nextSteps) {
            var nextSteps = document.createElement('div');
            nextSteps.className = 'notice';
            nextSteps.style.marginTop = '8px';
            nextSteps.innerHTML = '<strong>Next Steps:</strong> ' + data.nextSteps;
            resultEl.appendChild(nextSteps);
          }
          markLabComplete('secret-scanner');
        } else {
          showError(resultEl, data.hint || 'Validation failed. Try again!');
        }
      } catch (error) {
        hideLoading(resultEl);
        showError(resultEl, 'Validation request failed. Check your connection.');
        console.error('Validation error:', error);
      }
    }
  </script>
</body>
</html>
