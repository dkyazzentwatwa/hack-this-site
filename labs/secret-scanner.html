<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secret Scanner Lab - VulnLab Academy</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/app.js"></script>
  <script src="/assets/lab-content.js"></script>
  <!-- SECRET_KEY=sk_test_123456 -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>Pentest Toolkit</h1>
      <div class="tagline">Secret Scanner</div>
      <a class="home-link" href="/home/">← Home</a>
      <div class="nav-group">
        <h2>Labs</h2>
        <a href="/home/">Home</a>
        <a href="/owasp/a02.html">A02 Crypto Failures</a>
      </div>
    </aside>
    <main class="main">
      <h2 class="section-title">A02-002 Secret Scanner</h2>
      <div class="lab" data-lab-id="secret-scanner">
        <div>
          <h3>Exposed Secrets</h3>
          <p>Secrets are deliberately left in comments, JS, and storage.</p>
          <div class="notice mono">window.__SECRET_KEY__</div>
          <div style="margin-top:8px; display:flex; gap:8px;">
            <button type="button" onclick="loadSecrets()">Fetch /api/admin/secrets</button>
          </div>
          <div class="form-field" style="margin-top:12px;">
            <label for="secret-input">Paste a secret you found</label>
            <input id="secret-input" type="text" placeholder="e.g. a key, password, or token">
          </div>
          <button type="button" class="validate-btn" onclick="validateSecrets()">Validate Solution</button>
        </div>
        <div>
          <div class="notice mono">AWS_KEY=AKIA_TEST_EXAMPLE</div>
          <pre id="secret-output" class="notice mono" style="margin-top:8px">Output...</pre>
          <div id="validation-result"></div>
        </div>
      </div>
    </main>
  </div>
  <script>
    // Attach educational content
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function() {
        attachLabContent('secret-scanner');
      });
    } else {
      attachLabContent('secret-scanner');
    }

    function loadSecrets() {
      fetch('/api/admin/secrets')
        .then(function (r) { return r.text(); })
        .then(function (t) { document.getElementById('secret-output').textContent = t; });
    }

    async function validateSecrets() {
      var secret = document.getElementById('secret-input').value;
      var resultEl = document.getElementById('validation-result');
      // Proof = an actual planted secret, pasted from source/config/API.
      await submitValidation('secret-scanner', { secret: secret }, resultEl);
    }
  </script>
</body>
</html>
